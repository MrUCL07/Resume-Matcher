services:
  - type: web
    name: resume-matcher
    runtime: python
    plan: free
    # Install deps, then download the embedding model into the project folder so startup is fast.
    buildCommand: pip install -r requirements.txt && python scripts/warm_model.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LLM_PROVIDER
        value: gemini          # or "groq"
      - key: GEMINI_API_KEY
        sync: false            # set this in the Render dashboard, never in git
      - key: GROQ_API_KEY
        sync: false
